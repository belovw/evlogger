name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          RC=$?
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          exit $RC
      - name: Publish APK to Releases (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EvLogger.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EvLogger.apk --title "EV Logger v0.${{ github.run_number }} (latest build)" --notes "Build from commit ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: EvLogger-apk
          path: app/build/outputs/apk/debug/app-debug.apk
